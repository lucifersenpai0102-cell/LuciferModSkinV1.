
name: Build Lucifer Mod Skin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LuciferModSkinV1_Source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source
        run: |
          unzip LuciferModSkinV1_Source.zip -d source
          echo "PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -print -quit)")" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucifer-ModSkin-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
